<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AI-емулятор — Транспорт Чернівці</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚌</text></svg>" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #14161a;
      --panel: #1e2126;
      --panel2: #262a31;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --accent: #4f8cff;
      --danger: #ff5c5c;
      --ok: #43c463;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column-reverse; /* На мобільному: панель знизу, карта зверху */
      overflow: hidden;
    }

    .panel {
      background: var(--panel);
      padding: 10px;
      border-top: 1px solid #000;
      z-index: 1000;
      max-height: 45vh; /* На мобільному панель займає не більше 45% екрану */
      overflow-y: auto; /* Додаємо скрол, якщо план маршруту довгий */
    }

    @media (min-width: 768px) {
      body {
        flex-direction: row; /* На ПК: панель зліва, карта справа */
      }
      .panel {
        width: 380px;
        max-height: none;
        height: 100vh;
        border-top: none;
        border-right: 1px solid #000;
      }
    }

    .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .head a { color: var(--accent); text-decoration: none; font-size: 13px; font-weight: 500; }

    textarea {
      width: 100%;
      min-height: 58px;
      resize: vertical;
      background: var(--panel2);
      color: var(--text);
      border: 1px solid #333941;
      border-radius: 8px;
      padding: 8px 10px;
      font: inherit;
    }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }

    .chip {
      background: var(--panel2);
      border: 1px solid #333941;
      border-radius: 14px;
      padding: 3px 9px;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
    }

    .row { display: flex; gap: 8px; flex-wrap: wrap; }

    button {
      font: inherit;
      border: 0;
      border-radius: 8px;
      padding: 9px 14px;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    button.secondary { background: var(--panel2); color: var(--text); border: 1px solid #333941; }
    button.danger { background: var(--danger); }
    button:disabled { opacity: .45; cursor: not-allowed; }

    .status { margin-top: 8px; font-size: 13px; color: var(--muted); }
    .status.error { color: var(--danger); }
    .status.ok { color: var(--ok); }

    .answer {
      margin-top: 8px;
      background: var(--panel2);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 14px;
      display: none;
      white-space: pre-wrap;
    }

    /* Картки варіантів плану (поставка 1, §13 брифа): над саммарі (#answer).
       Активна картка виділяється акцентом; «програшний» параметр — приглушений
       помаранчевий з ⚠️, НЕ чистий червоний: це чесний розмен час↔гроші
       для порівняння, а не помилка. Пояснення («дорожче на 16 грн») — сіре. */
    .plan-variants { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .plan-variants[hidden] { display: none; }

    .variant-card {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 3px;
      flex: 1 1 150px;
      background: var(--panel2);
      color: var(--text);
      border: 1px solid #333941;
      border-radius: 10px;
      padding: 8px 10px;
      cursor: pointer;
      text-align: left;
      font-weight: 400;
      transition: border-color .15s, background .15s;
    }

    .variant-card:hover { border-color: #4a5260; }

    .variant-card.active {
      border-color: var(--accent);
      background: rgba(79, 140, 255, .14);
    }

    .variant-tag {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .3px;
      color: var(--accent);
    }

    .variant-card.active .variant-tag { color: #cfe0ff; }

    .variant-route { font-size: 13px; }

    .variant-meta { display: flex; gap: 10px; flex-wrap: wrap; font-size: 13px; }

    .variant-num.worse { color: #d9a05b; font-weight: 600; }

    .variant-note { font-size: 12px; color: var(--muted); }

    .badge { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 12px; margin-right: 6px; }
    .badge.live { background: #1e4620; color: #9ae6a8; }
    .badge.plan { background: #3a3320; color: #ffd88a; }
    .badge.sim { background: #3a2a14; color: #f0b45a; }   /* віртуальна машина */

    .map { flex: 1; min-height: 45vh; }

    .toggle { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
    .toggle input { accent-color: var(--accent); width: 16px; height: 16px; }

    input[type="datetime-local"] {
      background: var(--panel2);
      color: var(--text);
      border: 1px solid #333941;
      border-radius: 8px;
      padding: 7px 8px;
      font: inherit;
      font-size: 13px;
    }

    /* Маркер ТС: вся вёрстка стрелки — в vehicleIcon() (web/emulator.js),
       здесь только состояния из спецификации дизайна: live / planned /
       stopped (пульс обводки) / target (золотой пульс «сідати сюди»). */
    .veh-marker { background: none; border: none; }
    /* Целевой ТС всегда поверх остальных машин */
    .veh-marker.is-target { z-index: 1000 !important; }

    .veh-wrap { width: 36px; height: 36px; transition: opacity .3s ease, filter .3s ease, transform .25s ease; opacity: 1; }
    /* Тень держим на svg, чтобы filter у .planned/.target не срезал её */
    .veh-wrap svg { filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .45)); }

    /* За розкладом — приглушённо и чуть серо */
    .veh-wrap.planned { opacity: .6; filter: grayscale(40%); }

    /* Зупинено (speed_kmh < 3): напрямок неактуальний — стрілку ховаємо,
       а обводку пульсуємо. */
    .veh-wrap.stopped .veh-arrow { display: none; }
    @keyframes pulse-stopped {
      0% { stroke-width: 2.5; }
      50% { stroke-width: 5; filter: brightness(1.3); }
      100% { stroke-width: 2.5; }
    }
    .veh-wrap.stopped circle { animation: pulse-stopped 2s infinite ease-in-out; }

    /* Ціль плана: золоте пульсування + лёгкий рост */
    @keyframes pulse-target {
      0% { filter: drop-shadow(0 0 2px #ffd700); transform: scale(1); }
      50% { filter: drop-shadow(0 0 12px #ffd700); transform: scale(1.15); }
      100% { filter: drop-shadow(0 0 2px #ffd700); transform: scale(1); }
    }
    .veh-wrap.target svg { animation: pulse-target 1.5s infinite ease-in-out; }

    /* Розвантаження при віддаленні (специфікація дизайну, п. 4): без
       MarkerCluster — маркер стискається в кольорову крапку, номер маршруту
       і стрілка ховаються. Поріг зуму живе в DOT_ZOOM_BELOW (web/emulator.js),
       клас zoom-out ставить updateZoomState() на 'zoomend'.
       Трансформація — саме на .veh-wrap (36 px): якір Leaflet і popupAnchor
       вважаються від неї, тому точка не з'їжджає з координати. */
    body.zoom-out .veh-wrap { transform: scale(0.65); }
    body.zoom-out .veh-wrap text { display: none; }
    body.zoom-out .veh-arrow-group { display: none; }
    /* Віртуальна машина: штрих-пунктирне коло + плашка «SIM» (§3 брифа —
       симулятор не має видаватись за живий GPS). Плашку ховаємо при віддаленні,
       як і номер маршруту. */
    .veh-wrap.sim circle { stroke-dasharray: 3.5 2.5; }
    .veh-sim-badge {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      background: #b06a1f;
      color: #fff;
      font: 700 8px/1.6 -apple-system, "Segoe UI", Roboto, sans-serif;
      letter-spacing: .6px;
      padding: 1px 4px;
      border-radius: 4px;
      white-space: nowrap;
      pointer-events: none;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .5);
    }
    body.zoom-out .veh-sim-badge { display: none; }

    /* Попап машини (специфікація дизайну, п. 2): попапи Leaflet світлі,
       тому верстка під світлу тему. Розмітка — vehiclePopup() в emulator.js. */
    .veh-popup-head {
      border-bottom: 1px solid #ddd;
      padding-bottom: 6px;
      margin-bottom: 6px;
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .veh-popup-body {
      font-size: 13px;
      line-height: 1.5;
      color: #333;
    }

    .veh-popup-age, .veh-popup-progress {
      color: #666;
      font-size: 12px;
      margin-top: 4px;
    }

    /* План маршруту на карті (UX-апгрейд): хвости, шеврони напрямку, бейджі
       кроків, фініш, іконка пішої пересадки. Розмітка — renderPlan() в
       web/emulator.js, стилі тут. */
    .plan-stop, .plan-arrow, .plan-step-wrap, .plan-finish-wrap, .plan-walk-wrap {
      background: none;
      border: none;
    }

    /* Точка проміжної зупинки: акуратна біла точка в колір маршруту */
    .plan-stop-dot {
      box-sizing: border-box;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid var(--route-colour, #4f8cff);
      display: block;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .45);
      cursor: pointer;
    }

    .plan-stop-tooltip {
      padding: 4px 8px;
      border: 1px solid rgba(0, 0, 0, .18);
      border-radius: 4px;
      background: #fff;
      color: #222;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .25);
      font: 12px/1.35 -apple-system, "Segoe UI", Roboto, sans-serif;
      white-space: nowrap;
    }

    .plan-arrow-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
    }
    .plan-arrow-icon svg {
      width: 12px;
      height: 12px;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .7));
    }

    /* Посадка: крупний номер кроку, який пульсує — око чіпляється одразу */
    .plan-step {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid #fff;
      color: #fff;
      text-align: center;
      font: 700 15px/26px -apple-system, "Segoe UI", Roboto, sans-serif;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .45);
      animation: pulse-step 1.6s infinite ease-in-out;
    }

    @keyframes pulse-step {
      0% { transform: scale(1); box-shadow: 0 2px 6px rgba(0, 0, 0, .45); }
      50% { transform: scale(1.18); box-shadow: 0 0 14px rgba(255, 255, 255, .8); }
      100% { transform: scale(1); box-shadow: 0 2px 6px rgba(0, 0, 0, .45); }
    }

    .plan-finish {
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid #334155;
      background: #fff;
      font-size: 18px;
      line-height: 26px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .45);
    }

    .plan-walk-icon { font-size: 16px; line-height: 20px; text-align: center; }

    /* Цифра кроку в текстовій панелі: той самий колір, що й бейдж на карті */
    .step-dot {
      display: inline-block;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      color: #fff;
      text-align: center;
      cursor: pointer;
      font: 700 12px/18px -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    /* Пульсації — лише якщо користувач не просив їх вимкнути */
    @media (prefers-reduced-motion: reduce) {
      .plan-step { animation: none; }
    }

    /* Легенда карти (специфікація дизайну, п. 2.2): темна напівпрозора
       панелька в правому нижньому куті, над атрибуцією OSM. */
    .map-legend {
      background: rgba(30, 33, 38, 0.85);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #333941;
      font-size: 12px;
      color: var(--text);
      line-height: 1.6;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .4);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .map-legend .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .map-legend .legend-icon {
      width: 14px;
      text-align: center;
      font-size: 14px;
    }

    .hidden { display: none !important; }

    @media (max-width: 760px) {
      .panel { max-height: 62vh; overflow: auto; }
      .map { min-height: 38vh; }
    }
  </style>
</head>

<body>
  <div class="panel">
    <div class="head">
      <span>🚌 AI-емулятор маршруту</span>
      <span>
        <a href="/ui/admin.html">⚙️ Сленг і скарги</a>
        <a href="/docs" style="margin-left:10px;">API</a>
      </span>
    </div>

    <!-- Картки варіантів плану (поставка 1, §13 брифа): рендерить emulator.js,
         тільки коли /api/plan повернув >1 варіанта. Живуть НАД саммарі плану
         (саммарі — це #answer, який малює renderPlan). Клік по картці
         перемальовує план без повторного запиту. -->
    <div id="plan-variants" class="plan-variants" hidden aria-label="Варіанти маршруту"></div>
    <div id="answer" class="answer"></div>

    <textarea id="ask-text" placeholder="Наприклад: Я на Соборці, треба на Гравітон"></textarea>

    <div class="chips" id="chips"></div>

    <div class="row">
      <button id="ask-btn">🤖 AI, запитай мене</button>
      <button id="report-btn" class="danger" disabled>🚩 Це бред</button>
      <button id="clear-btn" class="secondary">Очистити карту</button>
    </div>

    <!-- Живий парк + «машина часу»: дивимось, як рухаються ТС по місту -->
    <div class="row" style="margin-top:8px; align-items:center;">
      <label class="toggle"><input type="checkbox" id="fleet-toggle" /> 🚌 живий парк</label>
      <input type="datetime-local" id="model-time" step="60" />
      <button id="fleet-now" class="secondary">зараз</button>
      <button id="fleet-play" class="secondary" disabled>▶ рух</button>
    </div>
    <div id="fleet-status" class="status"></div>

    <div id="status" class="status">готовий до роботи</div>

    <!-- Картки перенесено наверх -->

    <!-- Форма скарги: відкривається кнопкою «Це бред» -->
    <div id="report-form" class="hidden" style="margin-top:10px;">
      <div class="row" style="margin-bottom:6px;">
        <select id="report-kind" style="flex:1; background:var(--panel2); color:var(--text); border:1px solid #333941; border-radius:8px; padding:7px;">
          <option value="nonsense">Повна нісенітниця</option>
          <option value="wrong_route">Не той маршрут</option>
          <option value="wrong_stop">Не та зупинка</option>
          <option value="wrong_time">Не той час / очікування</option>
          <option value="other">Інше</option>
        </select>
      </div>
      <textarea id="report-comment" placeholder="Що саме не так? (необов'язково)"></textarea>
      <div class="row" style="margin-top:6px;">
        <button id="report-send" class="danger">Надіслати в логи</button>
        <button id="report-cancel" class="secondary">Скасувати</button>
      </div>
    </div>
  </div>

  <div id="map" class="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="emulator.js?v=2026-09-25a"></script>
</body>

</html>
