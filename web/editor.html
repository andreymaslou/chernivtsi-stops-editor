<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Редактор зупинок — Транспорт Онлайн Чернівці</title>
  <!-- Иконка в data:-URL: без неё браузер просит /favicon.ico и даёт 404 в консоли -->
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚌</text></svg>" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=2026-09-23a" />
  <!-- Панель эмулятора: стили скоупированы под #emu-panel (см. файл), чтобы
       не переопределять разметку/цвета редактора. -->
  <link rel="stylesheet" href="emulator-panel.css?v=2026-09-23a" />
  <!-- ⚠️ ?v=... у css/js — защита от кэша браузера. Без него телефон после
       деплоя продолжал рисовать СТАРЫЙ CSS (панель 45vh вместо шторок): сервер
       отдавал новый файл, а Chrome — свою копию. Поднимайте версию при правках
       style.css / emulator-panel.css / app.js / emulator.js. Со стороны сервера
       то же самое подстраховывает Cache-Control в main.py (middleware
       ui_static_no_cache). -->
  <!-- Шторка-пароль (`prompt` + `btoa`) убрана: она не защищала (пароль виден
       в исходнике страницы), но блокировала отрисовку до ответа на промпт и
       требовала `page.on('dialog', … accept(...))` в UI-тестах. Реальная защита
       при передаче стенда в прод — `auth_basic` в nginx (deploy/README_HTTPS.md). -->
</head>

<body>
  <div class="app">

    <!-- ШТОРКА РЕДАКТОРА: на десктопе это две обычные колонки (формы + список
         остановок), на телефоне (≤760px) — ОДНА панель, выезжающая сверху.
         Обёртка нужна именно для мобильного вида: две aside должны открываться
         и закрываться как одна шторка (стили — .drawer в style.css, логика —
         window.MobileSheets в app.js). На десктопе обёртка прозрачна: она просто
         flex-контейнер вокруг тех же двух колонок. -->
    <div id="drawer-editor" class="drawer">

      <!-- «Ручка» шторки: на десктопе скрыта (display:none в style.css) -->
      <div class="sheet-bar">
        <span>✏️ Редактор зупинок</span>
        <button type="button" class="sheet-bar-close" data-sheet-close="editor"
          aria-label="Згорнути редактор">▾</button>
      </div>

      <!-- LEFT PANEL: Forms -->
      <aside class="sidebar sidebar-forms">

        <!-- Header: logo + route selector ALL IN ONE ROW -->
        <div class="sidebar-header" style="padding: 7px 8px;">
          <div style="display:flex; align-items:center; gap:5px; flex-wrap:wrap;">
            <span style="font-size:15px; flex-shrink:0;">🚌</span>
            <div style="display:flex; background:#2A2A2A; border-radius:6px; padding:2px; flex-shrink:0;">
              <button id="btn-bus" class="type-btn active" onclick="setTransportType('bus')"
                style="padding:3px 6px; font-size:11px;">🚌</button>
              <button id="btn-trolley" class="type-btn" onclick="setTransportType('trolley')"
                style="padding:3px 6px; font-size:11px;">🚎</button>
            </div>
            <div style="flex-shrink:0;">
              <button id="routes-btn" type="button" class="input-field select-field"
                onclick="toggleRoutesDropdown(event)"
                style="width:64px; padding:3px 2px; font-size:12px; cursor:pointer; display:flex; align-items:center; gap:3px; justify-content:center;">
                <span id="routes-btn-label">0</span><span>☑</span>
              </button>
            </div>
            <select id="direction" class="input-field select-field" style="width:52px; padding:3px 2px; font-size:11px;"
              onchange="handleRouteChange()">
              <option value="A">А ➡</option>
              <option value="B">Б ⬅</option>
            </select>
          </div>
        </div>

        <!-- Routes multi-select (розкривається в потоці, не накриває решту) -->
        <div class="section" style="padding: 3px 8px;">
          <div id="routes-panel" class="routes-panel hidden">
            <div id="routes-checkboxes"></div>
          </div>
        </div>

        <!-- Route color palette -->
        <div class="section" style="padding: 5px 8px;">
          <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;" id="color-palette">
            <span style="font-size:10px; color:#aaa; white-space:nowrap;">🎨 Колір:</span>
          </div>
        </div>

        <!-- Search -->
        <div class="section" style="padding: 6px 8px;">
          <div class="search-wrap">
            <input type="text" id="search-input" class="input-field" placeholder="🔍 Пошук зупинки..."
              style="font-size:11px; padding:5px 6px;" />
            <button class="btn btn-secondary" id="search-btn" style="padding:5px 7px; font-size:12px;">🔍</button>
          </div>
          <div id="search-results" class="search-results hidden"></div>
        </div>

        <!-- Add/Edit stop form -->
        <div class="section" style="padding: 6px 8px;">
          <div style="display:flex; gap:4px; margin-bottom:5px; align-items:center;">
            <div class="stop-num" id="current_stop_order"
              style="display:flex; margin-top:0; min-width:26px; height:26px; font-size:11px;" title="Порядковий номер">+
            </div>
            <input type="text" id="stop-name" class="input-field" placeholder="Назва зупинки"
              style="flex:1; font-size:11px; padding:5px 6px;" />
          </div>
          <div style="display:flex; flex-direction:column; gap:4px; margin-bottom:6px;">
            <div style="display:flex; gap:4px; align-items:center;">
              <input type="number" id="stop-lat" class="input-field coord-input" placeholder="Широта" step="0.000001"
                style="padding:4px 6px; font-size:10px;" />
              <button class="btn-icon copy-mini" onclick="copyField('stop-lat')" title="Копіювати широту"
                style="width:24px; height:24px; font-size:11px; flex-shrink:0;">📋</button>
            </div>
            <div style="display:flex; gap:4px; align-items:center;">
              <input type="number" id="stop-lon" class="input-field coord-input" placeholder="Довгота" step="0.000001"
                style="padding:4px 6px; font-size:10px;" />
              <button class="btn-icon copy-mini" onclick="copyField('stop-lon')" title="Копіювати довготу"
                style="width:24px; height:24px; font-size:11px; flex-shrink:0;">📋</button>
            </div>
            <div style="display:flex; gap:4px; align-items:center;">
              <input type="number" id="stop-angle" class="input-field coord-input" placeholder="Кут °" step="1"
                style="padding:4px 6px; font-size:10px;" />
              <button class="btn-icon copy-mini" onclick="copyField('stop-angle')" title="Копіювати кут"
                style="width:24px; height:24px; font-size:11px; flex-shrink:0;">📋</button>
            </div>
          </div>
          <button class="btn btn-primary" id="add-stop-btn"
            style="width:60%; padding:5px; font-size:11px; margin:0 auto; display:block;">+
            Додати</button>
        </div>

      </aside>

      <!-- MIDDLE PANEL: Stops List (glued to forms, before map) -->
      <aside class="sidebar sidebar-list">
        <div class="stops-header" style="padding:6px 8px; border-bottom:1px solid var(--border); flex-shrink:0;">
          <div style="display:flex; align-items:center; gap:3px; flex-wrap:wrap;">
            <span style="font-size:10px; color:var(--text-secondary); white-space:nowrap; flex:1;">
              Зупинки <span id="route-label" style="color:var(--accent-light);">/ А</span>
              <span class="badge" id="stop-count" style="margin-left:2px;">0</span>
            </span>
            <button class="btn-icon" id="editor-clear-btn" title="Очистити список зупинок" style="font-size:11px; padding:2px 3px;">🗑</button>
            <input type="file" id="import-file-input" accept=".json" style="display:none;" />
            <button class="btn-icon" id="import-json-btn" title="Імпорт JSON"
              style="font-size:11px; padding:2px 3px;">⬆️</button>
            <button class="btn-icon" id="export-csv-btn" title="Експорт CSV"
              style="font-size:11px; padding:2px 3px;">📥</button>
            <button class="btn-icon" id="export-json-btn" title="Експорт JSON" style="font-size:11px; padding:2px 3px;">{
              }</button>
            <button class="btn-icon" id="btn-osm" title="Показати OSM зупинки" onclick="toggleOsmStops()"
              style="font-size:11px; padding:2px 3px;">🗺</button>
          </div>
        </div>
        <div id="stops-list" class="stops-list" style="flex:1; overflow-y:auto;">
          <div class="empty-state">Клікніть на карті щоб додати першу зупинку</div>
        </div>
      </aside>

    </div><!-- /#drawer-editor -->

    <!-- RIGHT: карта редактора + панель эмулятора поверх неё.
         position:relative нужен, чтобы #emu-panel (absolute) встала справа
         поверх карты, а не отдельной колонкой. -->
    <main class="map-container" style="position:relative;">
      <div id="map"></div>
      <div class="map-hint" id="ai-voice-hint" style="display:flex; justify-content:space-between; align-items:center; cursor:pointer; padding: 10px 16px;">
        <span style="color: #ffffff; font-weight: 800; font-size: 16px; letter-spacing: 0.5px;">(AI-ЗАПИТАЙ МЕНЕ)</span>
        <button id="ai-voice-btn" class="btn-icon" title="Голосове введення" style="pointer-events:auto; background:transparent; border:none; margin-left:12px; padding:0; display:flex; align-items:center; cursor:pointer;">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="#ffffff">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
        </button>
      </div>

      <!-- Панель эмулятора (перенесена из web/emulator.html).
           id сохранены как в эмуляторе: их читает web/emulator.js и
           проверяет tools/ui/check_emulator.js. -->
      <aside id="emu-panel">
        <div class="head">
          <span>🚌 AI-емулятор маршруту</span>
          <span>
            <a href="/ui/admin.html">⚙️ Сленг і скарги</a>
            <a href="/docs" style="margin-left:10px;">API</a>
          </span>
          <!-- Мобильные: «свернуть» нижнюю шторку. На десктопе кнопка скрыта
               (см. emulator-panel.css → #emu-panel .sheet-bar-close), поэтому
               вид .head там не меняется. -->
          <button type="button" class="sheet-bar-close" data-sheet-close="emu"
            aria-label="Згорнути емулятор">▾</button>
        </div>

        <textarea id="ask-text" placeholder="Наприклад: Я на Соборці, треба на Гравітон"></textarea>

        <div class="chips" id="chips"></div>

        <div class="row">
          <button id="ask-btn">🤖 AI, запитай мене</button>
          <button id="report-btn" class="danger" disabled>🚩 Це бред</button>
          <button id="clear-btn" class="secondary">Очистити карту</button>
        </div>

        <!-- Живий парк + «машина часу»: дивимось, як рухаються ТС по місту -->
        <div class="row" style="margin-top:8px; align-items:center;">
          <label class="toggle"><input type="checkbox" id="fleet-toggle" /> 🚌 живий парк</label>
          <input type="datetime-local" id="model-time" step="60" />
          <button id="fleet-now" class="secondary">зараз</button>
          <button id="fleet-play" class="secondary" disabled>▶ рух</button>
        </div>
        <div id="fleet-status" class="status"></div>

        <div id="status" class="status">готовий до роботи</div>

        <!-- Картки варіантів плану (поставка 1, §13 брифа): рендерить
             emulator.js, тільки коли /api/plan повернув >1 варіанта. Живуть
             НАД саммарі (#answer). Клік перемальовує план без повторного
             запиту; стилі — у emulator-panel.css, скоуповані під #emu-panel. -->
        <div id="plan-variants" class="plan-variants" hidden aria-label="Варіанти маршруту"></div>
        <div id="answer" class="answer"></div>

        <!-- Форма скарги: відкривається кнопкою «Це бред» -->
        <div id="report-form" class="hidden" style="margin-top:10px;">
          <div class="row" style="margin-bottom:6px;">
            <select id="report-kind" style="flex:1; background:var(--emu-panel2); color:var(--emu-text); border:1px solid #333941; border-radius:8px; padding:7px;">
              <option value="nonsense">Повна нісенітниця</option>
              <option value="wrong_route">Не той маршрут</option>
              <option value="wrong_stop">Не та зупинка</option>
              <option value="wrong_time">Не той час / очікування</option>
              <option value="other">Інше</option>
            </select>
          </div>
          <textarea id="report-comment" placeholder="Що саме не так? (необов'язково)"></textarea>
          <div class="row" style="margin-top:6px;">
            <button id="report-send" class="danger">Надіслати в логи</button>
            <button id="report-cancel" class="secondary">Скасувати</button>
          </div>
        </div>
      </aside>
    </main>

    <!-- Затемнення під відкритою шторкою: видно лише на ≤760px, клик закриває
         обидві шторки (див. .sheet-scrim у style.css). -->
    <div id="sheet-scrim" class="sheet-scrim"></div>

    <!-- Кнопки-перемикачі шторок. На десктопі сховані css-ом; на телефоні
         верхня (справа вгорі) відкриває редактор, нижня (зліва внизу) —
         емулятор. Праворуч угорі живе zoom самого Leaflet, тому кнопка
         редактора стоїть там, де немає конфлікту зі штатними контролами. -->
    <button type="button" id="sheet-toggle-editor" class="sheet-fab sheet-fab-top"
      aria-expanded="false" aria-controls="drawer-editor">✏️ Редактор</button>
    <button type="button" id="sheet-toggle-emu" class="sheet-fab sheet-fab-bottom"
      aria-expanded="false" aria-controls="emu-panel">🤖 Емулятор</button>

  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <!-- Export Modal -->
  <div id="export-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">Експорт даних</h3>
        <button class="modal-close" id="modal-close">✕</button>
      </div>
      <pre id="export-content" class="export-pre"></pre>
      <div class="modal-footer">
        <button class="btn btn-primary" id="copy-btn">📋 Скопіювати</button>
        <button class="btn btn-secondary" id="download-btn">⬇ Завантажити</button>
      </div>
    </div>
  </div>

  <!-- Шторка дозволу мікрофона (pre-permission): браузер ПІСЛЯ відмови більше
       не питає мікрофон сам — стан 'denied' живе до ручного скидання в
       налаштуваннях сайту. Тому спочатку наша шторка пояснює, навіщо він
       потрібен (режим ask), а після блокування — покрокова інструкція (режим
       denied). Логіка — emulator.js (voicePerm*), стилі — style.css (.perm-body). -->
  <div id="voice-perm-modal" class="modal-overlay hidden">
    <div class="modal" style="width: 460px;">
      <div class="modal-header">
        <h3 id="voice-perm-title">🎤 Доступ до мікрофона</h3>
        <button class="modal-close" id="voice-perm-close" aria-label="Закрити">✕</button>
      </div>
      <div class="perm-body" id="voice-perm-body"></div>
      <div class="modal-footer">
        <button class="btn btn-primary" id="voice-perm-ok">Дозволити</button>
        <button class="btn btn-secondary" id="voice-perm-cancel">Пізніше</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Порядок важен: app.js создаёт карту и публикует её как
       window.TRANSPORT_MAP; emulator.js подхватывает эту карту (а на
       отдельной странице /ui/emulator.html создаёт свою). -->
  <script src="app.js?v=2026-09-20c"></script>
  <script src="emulator.js?v=2026-09-23d"></script>
</body>

</html>
