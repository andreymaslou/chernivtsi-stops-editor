services:
  api_router:
    build: .
    container_name: api_router
    # ТЕСТОВЫЙ СТЕНД: порт открыт наружу НАМЕРЕННО — так эмулятор проверяется
    # с телефона/другой машины без nginx (см. docs/STATUS.md, §5.1).
    # Защиты тут нет, и это осознанно: данные эмулятора не секретны (остановки,
    # маршруты и расписания и так открыты на сайте перевозчика).
    # ⚠️ Единственный реальный риск — деньги, а не утечка: /api/route вызывает
    # LLM и тратит ключ OpenRouter, а API доступен любому, кто знает IP.
    # Держите лимит расхода в кабинете OpenRouter либо гасите контейнер, когда
    # не тестируете: `docker compose stop`.
    # В ПРОД (когда стенд отдаётся в боевое приложение) менять на
    # "127.0.0.1:8000:8000" и пускать трафик через nginx (HTTPS + Basic Auth,
    # при этом nginx проксирует на http://127.0.0.1:8000) — см.
    # deploy/README_HTTPS.md и deploy/setup-https.sh.
    # healthcheck контейнера бьёт по 127.0.0.1:8000 внутри контейнера и не зависит
    # от этого бинда.
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: always
    # Эмулятор и админка работают с папкой data/: сленговые правки и логи
    # жалоб должны переживать пересборку образа (иначе правки исчезнут).
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
