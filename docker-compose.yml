services:
  api_router:
    build: .
    container_name: api_router
    # С 2026-09-23 стенд работает как прод: бэкенд слушает ТОЛЬКО петлю, наружу
    # смотрит nginx на 80/443 (HTTPS + Basic Auth) — см. docs/STATUS.md §5.1 и
    # deploy/README_HTTPS.md. Адрес стенда: https://169.58.82.105.nip.io/
    # (сертификат Let's Encrypt выпускается скриптом deploy/setup-https.sh).
    # Зачем это нужно: Web Speech API и Geolocation требуют secure context —
    # по обычному http://<IP> браузер полностью блокирует микрофон, поэтому
    # голосовой ввод AI-помощника без HTTPS физически невозможен.
    # Прямой доступ на http://169.58.82.105:8000/ теперь закрыт — иначе nginx
    # с паролем обходится в обход, и защита бессмысленна.
    # ⚠️ Риск №1 остался прежним — деньги, а не утечка: /api/route вызывает
    # LLM и тратит ключ OpenRouter. Держите лимит расхода в кабинете OpenRouter
    # либо гасите контейнер, когда не тестируете: `docker compose stop`.
    # healthcheck контейнера бьёт по 127.0.0.1:8000 внутри контейнера и не зависит
    # от этого бинда.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    restart: always
    # Эмулятор и админка работают с папкой data/: сленговые правки и логи
    # жалоб должны переживать пересборку образа (иначе правки исчезнут).
    # logs/ — журнал телеметрии выбора вариантов плана (§13.3): он тоже
    # должен переживать рестарт контейнера, иначе аналитика теряется.
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
