services:
  api_router:
    build: .
    container_name: api_router
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: always
    # Эмулятор и админка работают с папкой data/: сленговые правки и логи
    # жалоб должны переживать пересборку образа (иначе правки исчезнут).
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
