# Эмулятор TransGPS: nginx-прокси перед контейнером api_router.
#
# Контейнер api_router слушает 127.0.0.1:8000 (порт забинджен на петлю в
# docker-compose.yml), поэтому снаружи приложение доступно ТОЛЬКО через nginx.
#
# Это ФИНАЛЬНОЕ состояние конфига: HTTP (80) отдаёт ACME-челлендж и
# редиректит на HTTPS, HTTPS (443) проксирует приложение и закрыт Basic Auth.
#
# ⚠️ Перед применением нужен ВЫПУЩЕННЫЙ сертификат
#    (/etc/letsencrypt/live/<домен>/fullchain.pem). Пока сертификата нет,
#    включать этот файл нельзя — `nginx -t` упадёт на отсутствии файлов.
#    Первичный выпуск делается по bootstrap-конфигу:
#      deploy/nginx-emulator-http.conf + deploy/setup-https.sh
#    Полная пошаговая инструкция — deploy/README_HTTPS.md.
#
# Ручная установка (после выпуска сертификата):
#   1) sudo htpasswd -c /etc/nginx/.htpasswd_transgps <логин>
#   2) sudo cp deploy/nginx-emulator.conf /etc/nginx/sites-available/transgps
#   3) sudo nano /etc/nginx/sites-available/transgps   # заменить emulator.example.com
#   4) sudo ln -sf /etc/nginx/sites-available/transgps /etc/nginx/sites-enabled/transgps
#   5) sudo nginx -t && sudo systemctl reload nginx
#
# Почему Basic Auth обязателен: /ui/admin.html — панель управления сленгом и
# логи жалоб, а «пароль» внутри index.html редактора — просто шторка в браузере,
# он виден в исходнике страницы. Настоящая защита — auth_basic здесь.
#
# Домены/пути, которые нужно заменить на свои, помечены <>. Один домен:
# все вхождения emulator.example.com меняются на ваш (setup-скрипт делает это сам).

# Один бэкенд-сокет с keepalive: меньше TCP-хендшейков на частые /api/live.
upstream transgps_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

# --- HTTP: только ACME + редирект на HTTPS ---------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name emulator.example.com;

    # ACME-челлендж Let's Encrypt: путь обязан быть публичным (без Basic Auth),
    # иначе выпуск/продление сертификата провалится.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        auth_basic off;
        allow all;
    }

    # Всё остальное по HTTP — на HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: приложение под Basic Auth -------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx >= 1.25: раскомментируйте `http2 on;` (для 1.18–1.24: `listen 443 ssl http2;`)
    # http2 on;
    server_name emulator.example.com;

    # Сертификат Let's Encrypt (certbot кладёт сюда). Имя папки = домен.
    ssl_certificate     /etc/letsencrypt/live/emulator.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/emulator.example.com/privkey.pem;

    # SSL-параметры задаём сами, чтобы не зависеть от include-файлов certbot.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Защита приложения. /ui/admin.html — чувствительная админка.
    auth_basic "TransGPS emulator";
    auth_basic_user_file /etc/nginx/.htpasswd_transgps;

    client_max_body_size 2m;

    # Минимум лишних заголовков наружу.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    # Корень открываем сразу в эмулятор: у FastAPI на "/" ответа нет.
    location = / {
        return 302 /ui/emulator.html;
    }

    location / {
        proxy_pass http://transgps_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # connection "" — keepalive к upstream (см. upstream-блок).
        proxy_set_header Connection "";
        # Живой слой опрашивает trans-gps.cv.ua раз в 5 с — держим таймаут с запасом.
        proxy_read_timeout 60s;
    }
}

