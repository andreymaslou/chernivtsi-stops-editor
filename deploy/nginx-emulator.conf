# Эмулятор TransGPS: nginx-прокси перед контейнером api_router (порт 8000).
#
# Установка на VPS (169.58.82.105):
#   1) sudo htpasswd -c /etc/nginx/.htpasswd_transgps <логин>      # создаст файл паролей
#   2) sudo cp deploy/nginx-emulator.conf /etc/nginx/sites-available/transgps
#   3) sudo nano /etc/nginx/sites-available/transgps                # вписать свой server_name
#   4) sudo ln -s /etc/nginx/sites-available/transgps /etc/nginx/sites-enabled/transgps
#   5) sudo nginx -t && sudo systemctl reload nginx
#   6) sudo certbot --nginx -d <домен>                              # HTTPS + автопродление
#
# Почему basic-auth обязателен: /ui/admin.html — это панель управления сленгом,
# а «пароль» внутри index.html редактора — просто шторка в браузере, не защита.
server {
    listen 80;
    server_name emulator.example.com;

    auth_basic "TransGPS emulator";
    auth_basic_user_file /etc/nginx/.htpasswd_transgps;

    client_max_body_size 2m;

    # Корень открываем сразу в эмулятор: у FastAPI на "/" ответа нет.
    location = / {
        return 302 /ui/emulator.html;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Живой слой опрашивает trans-gps.cv.ua раз в 5 с — держим таймаут с запасом.
        proxy_read_timeout 60s;
    }
}
