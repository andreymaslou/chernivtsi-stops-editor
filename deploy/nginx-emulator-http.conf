# Эмулятор TransGPS: BOOTSTRAP-конфиг nginx (только HTTP, без TLS).
#
# Зачем нужен отдельный файл: пока сертификата Let's Encrypt нет, включить
# 443-блок из deploy/nginx-emulator.conf нельзя — `nginx -t` упадёт на
# отсутствии /etc/letsencrypt/live/<домен>/fullchain.pem. Этот bootstrap
# поднимает порт 80, чтобы certbot мог пройти ACME-челлендж, после чего
# конфиг заменяется на финальный (nginx-emulator.conf).
#
# Порядок (подробно — deploy/README_HTTPS.md):
#   1) sudo cp deploy/nginx-emulator-http.conf /etc/nginx/sites-available/transgps
#   2) sudo nano /etc/nginx/sites-available/transgps   # заменить emulator.example.com
#   3) sudo ln -sf /etc/nginx/sites-available/transgps /etc/nginx/sites-enabled/transgps
#   4) sudo nginx -t && sudo systemctl reload nginx
#   5) sudo certbot certonly --webroot -w /var/www/certbot -d <домен>
#   6) заменить на deploy/nginx-emulator.conf и перезагрузить nginx
#
# Либо сразу запустить автоматизацию: sudo bash deploy/setup-https.sh <домен> <email>
#
# Пока HTTPS не включён, приложение доступно по http://<домен>/ под Basic Auth —
# это временное состояние, оно нужно только на время выпуска сертификата.

server {
    listen 80;
    listen [::]:80;
    server_name emulator.example.com;

    client_max_body_size 2m;

    # ACME-челлендж Let's Encrypt: путь обязан быть публичным (без Basic Auth),
    # иначе certbot не сможет подтвердить владение доменом.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        auth_basic off;
        allow all;
    }

    # Всё остальное — приложение под Basic Auth (уже на этом этапе, чтобы
    # временный HTTP-доступ не был открыт всем желающим).
    auth_basic "TransGPS emulator";
    auth_basic_user_file /etc/nginx/.htpasswd_transgps;

    # Корень открываем сразу в эмулятор: у FastAPI на "/" ответа нет.
    location = / {
        return 302 /ui/editor.html;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Живой слой опрашивает trans-gps.cv.ua раз в 5 с — держим таймаут с запасом.
        proxy_read_timeout 60s;
    }
}
